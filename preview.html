<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест парсинга Excel в MathJax</title>
  
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 20px auto;
      max-width: 900px;
      background-color: #f4f6f8;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      box-sizing: border-box;
      border: 2px dashed #007bff;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      background: #fff;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    button:hover { background: #0056b3; }
    .task-card {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      margin-top: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .task-header {
      font-weight: bold;
      color: #007bff;
      margin-bottom: 8px;
    }
    .task-body {
      font-size: 1.05em;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .task-meta {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>

  <h2>Проверка парсинга MathJax из Excel</h2>
  <p>Скопируйте ячейки из Excel (Ctrl+C) и вставьте в поле ниже (Ctrl+V):</p>
  
  <textarea id="excelInput" placeholder="Вставьте скопированные из Excel строки сюда..."></textarea>
  <br>
  <button onclick="renderExcelData()">Распарсить и отрисовать</button>

  <div id="output"></div>

  <script>
    // Обработка клика и авто-вставки
    document.getElementById('excelInput').addEventListener('input', renderExcelData);

    function renderExcelData() {
      const rawText = document.getElementById('excelInput').value;
      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = '';

      if (!rawText.trim()) return;

      // Парсинг TSV формата Excel (с поддержкой кавычек и переносов строк в ячейках)
      const rows = parseTSV(rawText);

      rows.forEach((cols, index) => {
        if (cols.length === 0 || !cols.some(c => c.trim())) return;
        
        // Пропускаем строку заголовков, если она есть
        if (cols[0].trim().toLowerCase() === 'task_num') return;

        const taskNum = cols[0] || (index + 1);
        const condition = cols[1] || '';
        const imageName = cols[2] || '';
        const answer = (cols.length >= 5 ? cols[4] : cols[3]) || '';

        const card = document.createElement('div');
        card.className = 'task-card';

        let html = `<div class="task-header">Задача № ${taskNum}</div>`;
        html += `<div class="task-body">${condition}</div>`;
        
        if (imageName || answer) {
          html += `<div class="task-meta">`;
          if (imageName) html += `<div>🖼️ <b>Картинка:</b> ${imageName}</div>`;
          if (answer) html += `<div>✅ <b>Ответ:</b> ${answer}</div>`;
          html += `</div>`;
        }

        card.innerHTML = html;
        outputDiv.appendChild(card);
      });

      // Перезапуск рендеринга MathJax
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([outputDiv]).catch(err => console.error(err));
      }
    }

    // Парсер TSV, который корректно разбирает экселевские кавычки и табуляции
    function parseTSV(text) {
      let rows = [];
      let currentRow = [''];
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        let char = text[i];
        let nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentRow[currentRow.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === '\t' && !inQuotes) {
          currentRow.push('');
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          rows.push(currentRow);
          currentRow = [''];
        } else {
          currentRow[currentRow.length - 1] += char;
        }
      }
      if (currentRow.length > 1 || currentRow[0] !== '') {
        rows.push(currentRow);
      }
      return rows;
    }
  </script>
</body>
</html>
